[package]
name = "burn-nerf-guided-splats"
version = "0.1.0"
edition = "2024"
description = "Interactive 3D Volumetric NeRF-guided 3D Gaussian Splatting engine built in pure Rust, Burn, and WebAssembly."
homepage = "https://magikerwin.github.io/burn-nerf-guided-splats/"
repository = "https://github.com/magikerwin/burn-nerf-guided-splats"
license = "MIT"
keywords = ["burn", "gaussian-splatting", "nerf", "webassembly", "3dgs"]
categories = ["graphics", "rendering", "science", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
burn = { version = "0.21.0", features = ["wgpu", "autodiff", "flex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "autodiff", "flex"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
